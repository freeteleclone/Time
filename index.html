<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>O'yla-So'yla</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<meta name="theme-color" content="#1f6b57">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,650&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f5f1;--surface:#fff;--line:#d9dfd6;--text:#16201b;--mute:#5d6b63;--acc:#1f6b57;--acc-ink:#fff;--soft:#e3efe9;--ok:#2f8f6b;--warn:#b7791f;--bad:#b3372f;--errbg:#fbeae8;--codebg:#eef1ec;color-scheme:light}
:root[data-theme=dark]{--bg:#0e1512;--surface:#141d19;--line:#25332d;--text:#e4ece7;--mute:#8ea299;--acc:#7bd4b4;--acc-ink:#0b1a14;--soft:#1b2a24;--ok:#7bd4b4;--warn:#e6b45c;--bad:#f19a92;--errbg:#2c1b1a;--codebg:#0a100d;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;overflow:hidden;overscroll-behavior:none}
html{height:-webkit-fill-available}
body{background:var(--bg);color:var(--text);font:16px/1.55 "Instrument Sans",system-ui,sans-serif;display:flex;flex-direction:column;max-width:760px;margin:0 auto;height:100vh;height:100dvh}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;user-select:none;-webkit-user-select:none;touch-action:manipulation;transition:transform .08s,background .15s}
button:active:not(:disabled){transform:scale(.95)}
select,input,textarea,a{-webkit-tap-highlight-color:transparent}
::selection{background:var(--soft);color:var(--text)}
#attThumb{width:34px;height:34px;object-fit:cover;border-radius:8px}
#selBar{position:fixed;left:50%;transform:translateX(-50%);bottom:92px;z-index:15;display:flex;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px;box-shadow:0 4px 18px #0003}
#selBar[hidden]{display:none}
@media print{html,body{height:auto!important;overflow:visible!important;position:static!important;max-width:none}header,.quota,.composer,#side,#scrim,.attbar,.acts,.chips,#selBar,.ed{display:none!important}#chat{overflow:visible!important;padding:0}.msg{break-inside:avoid}}
@media (prefers-reduced-motion:reduce){button{transition:none}button:active:not(:disabled){transform:none}}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
header{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:18px 20px 8px}
h1{font:650 28px/1 Fraunces,Georgia,serif;margin:0}
.sub{color:var(--mute);font-size:13px;margin-top:5px}
.tools,.chats{display:flex;gap:6px}
.chats{margin:0 20px 8px}
.chip{background:none;border:1px solid var(--line);border-radius:999px;padding:6px 13px;font-size:14px}
.chip:hover:not(:disabled){background:var(--soft)}
.chip:disabled{opacity:.5;cursor:default}
select.chip{flex:1;min-width:0;background:var(--surface);cursor:pointer}
.quota{margin:0 20px;font-size:13px;color:var(--mute)}
.quota .line{display:flex;flex-wrap:wrap;gap:2px 14px}
.quota b{color:var(--text);font-weight:600}
.bar{height:3px;background:var(--line);border-radius:2px;margin-top:7px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--ok);transition:width .3s}
#chat{flex:1;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:none;padding:18px 20px;display:flex;flex-direction:column;gap:18px}
.msg{word-wrap:break-word;max-width:94%}
.body{white-space:normal}
.body p{margin:0 0 .6em}.body>*:last-child{margin-bottom:0}
.body ul,.body ol{margin:0 0 .6em;padding-left:1.3em}
.body h4{margin:10px 0 4px;font:650 1.08em Fraunces,Georgia,serif}
.body blockquote{margin:0 0 .6em;padding-left:12px;border-left:3px solid var(--line);color:var(--mute)}
.body a{color:var(--acc)}
.tw{overflow-x:auto;margin:0 0 .6em}
table{border-collapse:collapse;font-size:.92em}
th,td{border:1px solid var(--line);padding:5px 10px;text-align:left}th{background:var(--soft)}
.ed{display:inline-flex;background:none;border:0;padding:3px;border-radius:8px;color:var(--mute);margin-left:8px;vertical-align:middle}
.ed .ic{width:15px;height:15px}
#lock{position:fixed;inset:0;z-index:50;background:var(--bg);display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:20px}
#lock.show{display:flex}
#lock input{width:min(260px,80vw);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 14px;text-align:center;font-size:18px;letter-spacing:.2em;color:var(--text)}
.me{align-self:flex-end;background:var(--soft);padding:9px 14px;border-radius:16px 16px 4px 16px;white-space:pre-wrap}
.ai{align-self:flex-start;border-left:2px solid var(--acc);padding-left:14px;min-width:0}
.ai.wait .body{color:var(--mute)}
.err{align-self:flex-start;background:var(--errbg);color:var(--bad);padding:9px 14px;border-radius:12px;white-space:pre-wrap}
.acts{display:flex;gap:14px;margin-top:4px}
.acts button,.cp{background:none;border:0;padding:0;color:var(--acc);font-size:13px;font-weight:600}
.code{white-space:normal;position:relative;margin:8px 0}
.code .cp{position:absolute;top:6px;right:10px}
pre{margin:0;background:var(--codebg);border:1px solid var(--line);border-radius:10px;padding:12px 14px;overflow-x:auto;font-size:13.5px;line-height:1.5}
code{font-family:ui-monospace,Consolas,monospace}
.body :not(pre)>code,.me code{background:var(--codebg);padding:1px 5px;border-radius:5px;font-size:.92em}
.composer{margin:0 20px 18px;display:flex;align-items:flex-end;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:8px 8px 8px 16px}
.composer:focus-within{border-color:var(--acc)}
textarea{flex:1;resize:none;background:none;border:0;outline:0;padding:7px 0;max-height:140px}
#send{background:var(--acc);color:var(--acc-ink);border:0;border-radius:12px;padding:9px 18px;font-weight:600}
dialog{background:var(--surface);color:var(--text);border:1px solid var(--line);border-radius:16px;max-width:460px;width:92%}
dialog::backdrop{background:#0007}
label{display:block;margin:12px 0 4px;font-size:13px;color:var(--mute)}
dialog input,dialog select{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.row{display:flex;gap:10px}.row>div{flex:1}
.check{display:flex;align-items:center;gap:8px;margin-top:14px;color:var(--text)}
.check input{width:auto}
.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
.actions .main{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
.note{font-size:12.5px;color:var(--mute);margin-top:8px}
.composer .chip{padding:7px 12px;align-self:center;white-space:nowrap}
#voiceBtn[aria-pressed=true]{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
.attbar{margin:0 20px 6px;font-size:13px;color:var(--mute);display:none;align-items:center;gap:10px}
.attbar.show{display:flex}
.attbar button{background:none;border:0;color:var(--bad);font-weight:600;padding:0}
textarea{scrollbar-width:none}
button.chip{display:inline-flex;align-items:center;justify-content:center;gap:8px}
.chip .ic{width:18px;height:18px;flex:none}
.sf button.chip{justify-content:flex-start}.row3 button.chip{justify-content:center}
.sw{position:relative}.sw .ic{position:absolute;left:12px;top:10px;width:16px;height:16px;color:var(--mute)}
#chatQ{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:7px 12px 7px 34px;color:var(--text)}
#chatList li{display:flex;align-items:center;border-radius:10px}
#chatList li:hover,#chatList li.active{background:var(--soft)}
#chatList li.active .ct{font-weight:600}
#chatList .ct{flex:1;width:auto;min-width:0;display:flex;align-items:center;gap:8px;background:none;border:0;padding:9px 4px 9px 12px;border-radius:10px}
#chatList .ct span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#chatList .cx{width:auto;background:none;border:0;padding:8px 10px;color:var(--mute);opacity:.6;display:flex}
#chatList .cx:hover{opacity:1;color:var(--bad)}
#chatList .cx .ic{width:16px;height:16px}
:root[data-accent=blue]{--acc:#2f5fb3;--soft:#e4ecf8}
:root[data-accent=violet]{--acc:#6b4bb8;--soft:#ece6f8}
:root[data-accent=amber]{--acc:#a8641a;--soft:#f6ead9}
:root[data-theme=dark][data-accent=blue]{--acc:#8db3ff;--soft:#1a2436}
:root[data-theme=dark][data-accent=violet]{--acc:#b9a2ff;--soft:#241d36}
:root[data-theme=dark][data-accent=amber]{--acc:#f0b86e;--soft:#33291a}
.hb{display:flex;gap:6px}.sh .chip.ib{width:34px;height:34px}
dialog .row3{margin-top:10px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.srcs{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12.5px;margin-top:6px}
.srcs a{color:var(--acc)}
.sf{gap:6px}.sf .chip{padding:5px 12px}
.row3{display:flex;gap:6px}.row3 .chip{width:auto;flex:1;padding:5px 4px}
.sr{display:flex;align-items:center;gap:8px;margin:6px 0;font-size:14px}
.sr span{width:44px;color:var(--mute)}.sb{flex:1;height:10px}.sb i{display:block;height:100%;background:var(--acc);border-radius:5px;min-width:2px}
.ic{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;display:block}
.chip.ib,.composer .chip.ib{display:inline-flex;align-items:center;justify-content:center;width:38px;height:38px;padding:0;border-radius:50%;flex:none}
#send{display:inline-flex;align-items:center;justify-content:center;width:38px;height:38px;padding:0;border-radius:50%;flex:none}
.acts button,.cp{display:inline-flex;align-items:center;padding:4px;border-radius:8px}
.acts button:hover,.cp:hover{background:var(--soft)}
.acts .ic,.cp .ic{width:17px;height:17px}
.code .cp{top:6px;right:8px;background:var(--codebg)}
#voiceBtn[aria-pressed=true]{animation:pulse 1.4s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 var(--soft)}100%{box-shadow:0 0 0 10px transparent}}
@media (prefers-reduced-motion:reduce){#voiceBtn[aria-pressed=true]{animation:none}}
#chat::-webkit-scrollbar,textarea::-webkit-scrollbar,#chatList::-webkit-scrollbar{display:none}
.hl{display:flex;align-items:flex-end;gap:12px}
#side{position:fixed;top:0;left:0;bottom:0;width:min(300px,86vw);background:var(--surface);border-right:1px solid var(--line);z-index:20;display:flex;flex-direction:column;gap:12px;padding:18px 16px;transform:translateX(-100%);visibility:hidden;transition:transform .25s,visibility .25s}
#side.open{transform:none;visibility:visible}
#scrim{position:fixed;inset:0;background:#0006;z-index:10;opacity:0;pointer-events:none;transition:opacity .25s}
#scrim.show{opacity:1;pointer-events:auto}
.sh{display:flex;align-items:center;justify-content:space-between}
.sh h2{margin:0;font:650 20px Fraunces,Georgia,serif}
#chatList{list-style:none;margin:0;padding:0;overflow-y:auto;flex:1;scrollbar-width:none}
#chatList button{display:block;width:100%;text-align:left;background:none;border:0;border-radius:10px;padding:9px 12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#chatList button:hover{background:var(--soft)}
#chatList button.active{background:var(--soft);font-weight:600}
#side select.chip{width:100%;flex:none}
.sf{display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line);padding-top:12px}
.sf .chip{width:100%}
.main{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
@media (prefers-reduced-motion:reduce){#side,#scrim{transition:none}}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
</style>
</head>
<body>
<header>
  <div class="hl">
    <button class="chip ib" id="menuBtn" type="button" aria-expanded="false" aria-controls="side" aria-label="Menyuni ochish va yopish" title="Menyu"></button>
    <div><h1 id="brand">O'yla-So'yla</h1><div class="sub">O'zbekcha ovozli AI yordamchi</div></div>
  </div>
</header>

<section class="quota" aria-label="Limit holati" title="Hisoblagich faqat shu ilovadan ketgan so'rovlarni biladi">
  <div class="line"><span>Bugun <b id="dayTxt">0/0</b></span><span>Daqiqada <b id="minTxt">0/0</b></span><span id="resetTxt"></span></div>
  <div class="bar"><i id="dayBar"></i></div>
</section>

<main id="chat" aria-live="polite"></main>

<div class="attbar" id="attbar"><img id="attThumb" alt="" hidden><span id="attName"></span><button type="button" id="attX">Olib tashla</button></div>
<form id="form" class="composer">
  <input id="file" type="file" accept="image/*,application/pdf,text/*,.md,.json,.csv,.txt" hidden>
  <button class="chip ib" id="attBtn" type="button" aria-label="Rasm yoki fayl biriktirish" title="Rasm yoki fayl"></button>
  <textarea id="inp" rows="1" placeholder="Savolingni yoz..." aria-label="Xabar"></textarea>
  <button class="chip ib" id="voiceBtn" type="button" aria-pressed="false" aria-label="Ovozli suhbat" title="Ovozli suhbat"></button>
  <button id="send" type="submit" aria-label="Yubor" title="Yubor"></button>
</form>

<div id="lock" role="dialog" aria-modal="true" aria-label="PIN-kod">
  <h2 style="margin:0;font:650 26px Fraunces,Georgia,serif">O'yla-So'yla</h2>
  <input id="lockIn" type="password" inputmode="numeric" autocomplete="off" placeholder="PIN-kod" aria-label="PIN-kod">
  <button class="chip main" id="lockBtn" type="button">Ochish</button>
  <div class="note" id="lockErr"></div>
</div>
<div id="scrim"></div>
<aside id="side" aria-label="Menyu" inert>
  <div class="sh"><h2>Suhbatlar</h2><div class="hb">
    <button class="chip ib" id="theme" type="button" aria-label="Yorug' va qorong'u rejimni almashtirish"></button>
    <button class="chip ib" id="delChat" type="button" aria-label="Joriy suhbatni o'chir" title="Joriy suhbatni o'chir"></button>
    <button class="chip ib" id="closeSide" type="button" aria-label="Menyuni yopish" title="Yopish"></button>
  </div></div>
  <button class="chip main" id="newChat" type="button">Yangi suhbat</button>
  <div class="sw"><span id="swIco"></span><input id="chatQ" type="search" placeholder="Suhbatlarda qidir..." aria-label="Suhbatlarda qidir"></div>
  <ul id="chatList"></ul>
  <div class="sf"><button class="chip" id="openSet" type="button">Sozlamalar</button></div>
</aside>

<dialog id="dlg">
  <h2 style="margin:0;font:650 20px Fraunces,Georgia,serif">Sozlamalar</h2>
  <label for="roleSel">Rol</label>
  <select class="chip" id="roleSel"></select>
  <div class="row3"><button class="chip" id="stop" type="button">Ovozni to'xtat</button><button class="chip" id="statBtn" type="button">Statistika</button></div>
  <div class="row3"><button class="chip" id="expJson" type="button" title="Barcha suhbatlarni JSON qilib saqlash">JSON</button><button class="chip" id="expMd" type="button" title="Joriy suhbatni matn qilib saqlash">Matn</button><button class="chip" id="impBtn" type="button" title="JSON fayldan suhbatlarni qaytarish">Import</button></div>
  <input id="imp" type="file" accept=".json,application/json" hidden>
  <div class="row3"><button class="chip" id="pdfBtn" type="button" title="Suhbatni PDF qilib saqlash">PDF</button><button class="chip" id="readAll" type="button">Hammasini o'qi</button></div>
  <label for="name">AI nomi (sayt nomi)</label>
  <input id="name" type="text" maxlength="30">
  <label for="key">Gemini API key</label>
  <input id="key" type="text" autocomplete="off" spellcheck="false">
  <label for="model">Model</label>
  <input id="model" type="text" list="models">
  <label for="fallback">Zaxira model (ixtiyoriy, asosiysi band bo'lsa shunga o'tadi)</label>
  <input id="fallback" type="text" list="models" placeholder="Masalan, yengilroq model">
  <datalist id="models"></datalist>
  <button class="chip" id="loadModels" type="button" style="margin-top:8px">Modellar ro'yxatini yuklash</button>
  <div class="note" id="modelNote"></div>
  <div class="row">
    <div><label for="rpd">Kunlik limit (RPD)</label><input id="rpd" type="number" min="1"></div>
    <div><label for="rpm">Daqiqalik limit (RPM)</label><input id="rpm" type="number" min="1"></div>
  </div>
  <label for="ttsEngine">Ovoz manbai</label>
  <select id="ttsEngine"><option value="browser">Brauzer ovozi (tekin, cheksiz)</option><option value="gemini">Gemini ovozi (sifatliroq, limitli)</option></select>
  <div class="row"><div><label for="ttsModel">Gemini ovoz modeli</label><input id="ttsModel" type="text" list="models"></div><div><label for="ttsVoice">Ovoz nomi</label><input id="ttsVoice" type="text"></div></div>
  <label for="voice">Brauzer ovozi</label>
  <select id="voice"></select>
  <label for="custom">Shaxsiy ko'rsatma (AI doim shunga amal qiladi)</label>
  <textarea id="custom" rows="3" style="width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 10px;color:var(--text);font:inherit"></textarea>
  <label for="proxy">Proxy manzili (ixtiyoriy; bo'lsa key kerak emas)</label>
  <input id="proxy" type="text" placeholder="https://nom.workers.dev">
  <label class="check"><input id="web" type="checkbox"> Internetdan qidirib javob ber (Google qidiruvi)</label>
  <div class="row"><div><label for="accent">Rang</label><select id="accent"><option value="green">Yashil</option><option value="blue">Ko'k</option><option value="violet">Binafsha</option><option value="amber">Amber</option></select></div>
  <div><label for="fs">Matn o'lchami</label><select id="fs"><option value="15">Kichik</option><option value="16">O'rta</option><option value="18">Katta</option></select></div></div>
  <label for="rate">Ovoz tezligi</label>
  <input id="rate" type="range" min="0.7" max="1.5" step="0.1">
  <div class="row"><div><label for="len">Javob uzunligi</label><select id="len"><option value="short">Qisqa</option><option value="normal">Odatiy</option><option value="long">Batafsil</option></select></div>
  <div><label for="temp">Ijodkorlik</label><input id="temp" type="range" min="0" max="2" step="0.1"></div></div>
  <label class="check"><input id="autoTitle" type="checkbox"> Suhbatga nomni AI qo'ysin (1 ta qo'shimcha so'rov)</label>
  <label for="pin">PIN-kod (o'chirish uchun "-" yoz)</label>
  <input id="pin" type="password" inputmode="numeric" autocomplete="off" placeholder="yangi PIN">
  <label for="prompts">Tayyor promptlar (har qatorda bittadan; bo'sh chatda tugma bo'ladi)</label>
  <textarea id="prompts" rows="3" style="width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 10px;color:var(--text);font:inherit"></textarea>
  <label for="sttEngine">Mikrofon manbai</label>
  <select id="sttEngine"><option value="browser">Brauzer (tekin)</option><option value="gemini">Gemini (aniqroq, limitli)</option></select>
  <label for="lang">Mikrofon tili</label>
  <select id="lang"><option value="uz-UZ">O'zbekcha</option><option value="ru-RU">Ruscha</option><option value="en-US">Inglizcha</option></select>
  <label class="check"><input id="auto" type="checkbox"> Javoblarni avtomatik o'qi</label>
  <div id="voiceNote" class="note"></div>
  <div class="note">Hisoblagich faqat shu ilovadan ketgan so'rovlarni biladi. Aniq limitni AI Studio'da tekshir.</div>
  <div class="actions"><button class="chip" id="cancel" type="button">Bekor qilish</button><button class="chip main" id="save" type="button">Saqlash</button></div>
</dialog>

<dialog id="statDlg">
  <h2 style="margin:0;font:650 20px Fraunces,Georgia,serif">Statistika</h2>
  <div class="note">Oxirgi 14 kun, kuniga so'rovlar soni (Tinch okeani sanasi bo'yicha)</div>
  <div id="statBody"></div>
  <div class="actions"><button class="chip" id="statClose" type="button">Yopish</button></div>
</dialog>

<script>
// Key bu yerda saqlanmaydi: uni Sozlamalarga yoz (faqat sening brauzeringda saqlanadi) yoki proxy ishlat.
const DEFAULT_KEY = "";
const DEFAULTS = {key: DEFAULT_KEY, model: "gemini-3.8-flash", fallback: "", rpd: 100, rpm: 5, voice: "", auto: true, lang: "uz-UZ", name: "O'yla-So'yla", custom: "", proxy: "", web: false, rate: 1, accent: "green", fs: 16, len: "normal", temp: 0.7, autoTitle: false, pinHash: "", ttsEngine: "browser", ttsModel: "gemini-3.8-flash-lite-tts", ttsVoice: "Kore", sttEngine: "browser", prompts: ""};
const LEN = {short:" Javobni juda qisqa (1-3 gap) qil.", normal:"", long:" Javobni batafsil va misollar bilan yoz."};
const FILE_PROMPT = "Bu fayl haqida qisqa ayt. Rasmda matn bo'lsa, uni o'qib ber.";

/* ---------- Limit hisobi (Tinch okeani vaqti) ---------- */
function laNow(){
  const p = new Intl.DateTimeFormat("en-CA", {timeZone:"America/Los_Angeles", year:"numeric", month:"2-digit", day:"2-digit", hour:"2-digit", minute:"2-digit", second:"2-digit", hourCycle:"h23"}).formatToParts(new Date());
  const g = t => p.find(x => x.type === t).value;
  return {day:`${g("year")}-${g("month")}-${g("day")}`, sec:(+g("hour"))*3600 + (+g("minute"))*60 + (+g("second"))};
}
function syncDay(){ const d = laNow().day; if(usage.day !== d){ usage = {day:d, count:0, exhausted:false}; LS.set("usage", usage); } }
function fmtLeft(s){ const h = Math.floor(s/3600), m = Math.floor(s%3600/60); return h ? `${h} soat ${m} daqiqa` : `${m} daqiqa ${s%60} soniya`; }
function renderQuota(){
  syncDay();
  const now = Date.now();
  stamps = stamps.filter(t => now - t < 60000);
  const left = 86400 - laNow().sec;
  const at = new Date(now + left*1000).toLocaleTimeString("uz-UZ", {hour:"2-digit", minute:"2-digit"});
  const pct = Math.min(100, usage.count / cfg.rpd * 100);
  $("dayTxt").textContent = `${usage.count}/${cfg.rpd}`;
  $("minTxt").textContent = `${stamps.length}/${cfg.rpm}`;
  const bar = $("dayBar");
  bar.style.width = (usage.exhausted ? 100 : pct) + "%";
  bar.style.background = usage.exhausted || pct >= 90 ? "var(--bad)" : pct >= 70 ? "var(--warn)" : "var(--ok)";
  $("resetTxt").textContent = (usage.exhausted ? "Limit tugadi. " : "") + `Tiklanishiga ${fmtLeft(left)} (soat ${at})`;
}
setInterval(renderQuota, 1000);

let curU = null, curSrc = null, gDone = null, gseq = 0, actx = null, gWarned = false;
const apiBase = () => cfg.proxy ? cfg.proxy.replace(/\/+$/, "") : "https://generativelanguage.googleapis.com";
const apiHeaders = () => cfg.proxy ? {"Content-Type":"application/json"} : {"Content-Type":"application/json", "x-goog-api-key":cfg.key};
const isSpeaking = () => synth.speaking || !!curSrc;
function stopGemini(callDone){
  gseq++;
  const d = gDone; gDone = null;
  try{ if(curSrc){ curSrc.onended = null; curSrc.stop(); } }catch(e){}
  curSrc = null;
  if(callDone && d) d();
}
function speak(text, done){ if(cfg.ttsEngine === "gemini") geminiSpeak(text, done); else browserSpeak(text, done); }
async function geminiSpeak(text, done){
  const t = plain(text);
  if(!t){ if(done) done(); return; }
  stopGemini(false);
  const my = ++gseq; gDone = done || null;
  try{
    const r = await fetch(`${apiBase()}/v1beta/models/${encodeURIComponent(cfg.ttsModel)}:generateContent`, {
      method:"POST", headers:apiHeaders(),
      body:JSON.stringify({contents:[{parts:[{text:t}]}], generationConfig:{responseModalities:["AUDIO"], speechConfig:{voiceConfig:{prebuiltVoiceConfig:{voiceName:cfg.ttsVoice}}}}})
    });
    const d = await r.json();
    if(!r.ok) throw new Error((d.error && d.error.message) || r.status);
    if(my !== gseq) return;
    const part = d.candidates[0].content.parts.find(x => x.inlineData).inlineData;
    const rate = +((/rate=(\d+)/.exec(part.mimeType || "") || [])[1]) || 24000;
    const bin = atob(part.data), n = bin.length >> 1, f = new Float32Array(n);
    for(let i = 0; i < n; i++){ let v = bin.charCodeAt(2*i) | (bin.charCodeAt(2*i+1) << 8); if(v >= 32768) v -= 65536; f[i] = v / 32768; }
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    if(actx.state === "suspended") await actx.resume();
    if(my !== gseq) return;
    const buf = actx.createBuffer(1, n, rate); buf.copyToChannel(f, 0);
    const src = actx.createBufferSource(); src.buffer = buf; src.connect(actx.destination);
    curSrc = src;
    src.onended = () => { if(my !== gseq) return; curSrc = null; const dn = gDone; gDone = null; if(dn) dn(); };
    src.start();
  }catch(e){
    if(my !== gseq) return;
    gDone = null;
    if(!gWarned){ gWarned = true; addMsg("err", "Gemini ovozi ishlamadi (" + e.message + "). Brauzer ovoziga o'tdim. Sozlamalarda ovoz modelini tekshir."); }
    browserSpeak(text, done);
  }
}

function browserSpeak(text, done){
  if(!("speechSynthesis" in window)){ if(done) done(); return; }
  synth.cancel();
  const u = new SpeechSynthesisUtterance(plain(text));
  const rl = roleLang();
  const v = (rl && voices.find(x => x.lang.toLowerCase().startsWith(rl.slice(0, 2)))) || voices.find(x => x.name === cfg.voice) || voices.find(x => /^uz/i.test(x.lang));
  if(v){ u.voice = v; u.lang = v.lang; } else { u.lang = rl || "uz-UZ"; }
  curU = u; u.rate = +cfg.rate || 1;
  u.onend = u.onerror = () => { if(curU === u && done) done(); };
  synth.speak(u);
}

/* ---------- Xabarlarni chizish (kod bloklari bilan) ---------- */
function md(t){
  return t.split("```").map((p, i) => {
    if(i % 2){
      const nl = p.indexOf("\n");
      const code = nl > -1 && /^[\w+#.-]*$/.test(p.slice(0, nl).trim()) ? p.slice(nl+1) : p;
      return `<div class="code"><button type="button" class="cp" title="Nusxa olish" aria-label="Nusxa olish">${ic("copy")}</button><pre><code>${esc(code.replace(/\n$/, ""))}</code></pre></div>`;
    }
    return blocks(p);
  }).join("");
}
function copy(text, btn){
  const done = () => { const o = btn.innerHTML; btn.innerHTML = ic("check"); setTimeout(() => btn.innerHTML = o, 1200); };
  try{ navigator.clipboard.writeText(text).then(done, () => {}); }catch(e){}
}
$("chat").addEventListener("click", e => {
  const b = e.target.closest(".cp");
  if(b) copy(b.parentElement.querySelector("code").textContent, b);
});
function addMsg(cls, text, acts){
  const d = document.createElement("div");
  d.className = "msg " + cls;
  if(cls === "me" || cls === "err"){ d.textContent = text; }
  else {
    const b = document.createElement("div");
    b.className = "body"; b.innerHTML = md(text);
    d.appendChild(b);
    if(acts) addActs(d, text);
  }
  $("chat").appendChild(d);
  $("chat").scrollTop = $("chat").scrollHeight;
  return d;
}
function addActs(d, text){
  const a = document.createElement("div");
  a.className = "acts";
  const c = document.createElement("button"); c.type = "button"; c.innerHTML = ic("copy"); c.title = "Nusxa olish"; c.setAttribute("aria-label", c.title); c.onclick = () => copy(text, c);
  const s = document.createElement("button"); s.type = "button"; s.innerHTML = ic("speaker"); s.title = "O'qib ber"; s.setAttribute("aria-label", s.title); s.onclick = () => { if(isSpeaking()){ sq.items = []; synth.cancel(); stopGemini(true); } else speak(text); };
  a.append(c, s); d.appendChild(a);
}

/* ---------- So'rov (streaming, qayta urinish, zaxira model) ---------- */
function apiHistory(c){
  const sl = c.msgs.slice(-MAX_CTX), ld = sl.map(m => !!m._d).lastIndexOf(true);
  const h = sl.map((m, i) => {
    let t = m.text;
    if(m.role === "user" && t.startsWith("(fayl)")) t = t.replace("(fayl)", FILE_PROMPT);
    if(m.att) t += `\n\n[Fayl: ${m.att.name}]\n${m.att.text}`;
    const parts = [{text:t}];
    if(m._d && i === ld) parts.push({inlineData:{mimeType:m._d.mime, data:m._d.data}});
    return {role:m.role, parts};
  });
  while(h.length && h[0].role === "model") h.shift();
  return h;
}
async function ask(text, att){
  if(!navigator.onLine) return add_err("Internet yo'q. Ulanishni tekshir.");
  if(!cfg.key && !cfg.proxy) return add_err("Avval Sozlamalarda API key yoki proxy manzilini kirit.");
  lastReq = {text, att};
  syncDay();
  stamps = stamps.filter(t => Date.now() - t < 60000);
  if(usage.count >= cfg.rpd) return add_err("Kunlik limit tugadi. Tiklanish vaqti yuqorida ko'rsatilgan.");
  if(stamps.length >= cfg.rpm) return add_err("Daqiqalik limitga yetding. Bir oz kutib, qayta yubor.");

  const c = curChat();
  if(!c.msgs.length) $("chat").innerHTML = "";
  const shown = (text || "(fayl)") + (att ? `\n[Fayl: ${att.name}]` : "");
  const um = {role:"user", text:shown};
  if(att){ if(att.text) um.att = {name:att.name, text:att.text}; else Object.defineProperty(um, "_d", {value:att}); }
  c.msgs.push(um);
  if(c.title === "Yangi suhbat") c.title = shown.slice(0, 32);
  save(); renderChats();
  addMsg("me", shown);
  setBusy(true);
  ctrl = new AbortController();
  if(voiceMode) vstate("O'ylayapman...");
  const bub = addMsg("ai wait", "O'ylayapman...", false);
  const body = bub.querySelector(".body");
  stamps.push(Date.now()); usage.count++; LS.set("usage", usage); bump(1); renderQuota();
  sqClear(); synth.cancel(); stopGemini(false); curU = null;

  let full = "", failed = null, spoke = false, srcs = [], lastTok = 0;
  try{
    const models = [cfg.model, cfg.fallback].filter(Boolean);
    const base = cfg.proxy ? cfg.proxy.replace(/\/+$/, "") : "https://generativelanguage.googleapis.com";
    let r = null, data = {};
    for(const m of models){
      for(let a = 0; a < 4; a++){
        r = await fetch(`${base}/v1beta/models/${encodeURIComponent(m)}:streamGenerateContent?alt=sse`, {
          method:"POST", signal:ctrl.signal,
          headers:cfg.proxy ? {"Content-Type":"application/json"} : {"Content-Type":"application/json", "x-goog-api-key":cfg.key},
          body:JSON.stringify({systemInstruction:{parts:[{text:sysText() + (c.summary ? "\nSuhbatning oldingi qismi xulosasi: " + c.summary : "") + "\n" + ROLES[LS.get("role","oddiy")].p}]}, contents:apiHistory(c), generationConfig:{temperature:+cfg.temp}, ...(cfg.web ? {tools:[{google_search:{}}]} : {})})
        });
        if(r.ok) break;
        data = await r.json().catch(() => ({}));
        if(!RETRY_CODES.includes(r.status)) break;
        if(a < 3){ body.textContent = `Google serveri band (${r.status}). Qayta urinyapman (${a+1}/3)...`; await sleep(2000 * 2 ** a); }
      }
      if(r.ok || [400,401,403].includes(r.status)) break;
      if(m !== models[models.length-1]) body.textContent = `${m} ishlamadi, zaxira modelga o'tyapman...`;
    }
    if(!r.ok){
      failed = {status:r.status, msg: RETRY_CODES.includes(r.status) ? "Google serveri hozir band, bu vaqtinchalik. Bir ozdan keyin qayta yubor." : (data.error && data.error.message) || "Noma'lum xato"};
    } else {
      const rd = r.body.getReader(), dec = new TextDecoder();
      let buf = "";
      for(;;){
        const {done, value} = await rd.read();
        if(done) break;
        buf += dec.decode(value, {stream:true});
        const lines = buf.split("\n"); buf = lines.pop();
        for(const ln of lines){
          if(!ln.startsWith("data:")) continue;
          let j; try{ j = JSON.parse(ln.slice(5)); }catch(e){ continue; }
          if(j.error){ failed = {status:j.error.code || 500, msg:j.error.message}; continue; }
          if(j.usageMetadata && j.usageMetadata.totalTokenCount) lastTok = j.usageMetadata.totalTokenCount;
          const gc = (((j.candidates||[])[0]||{}).groundingMetadata||{}).groundingChunks;
          if(gc) gc.forEach(g => { if(g.web && g.web.uri && !srcs.some(x => x.uri === g.web.uri)) srcs.push(g.web); });
          const parts = (((j.candidates||[])[0]||{}).content||{}).parts;
          if(parts){ full += parts.map(p => p.text || "").join(""); bub.classList.remove("wait"); body.innerHTML = md(full); if(cfg.auto || voiceMode) feed(full, false); $("chat").scrollTop = $("chat").scrollHeight; }
        }
      }
      if(!full && !failed) failed = {status:"", msg:"Javob bo'sh keldi (xavfsizlik filtri bo'lishi mumkin). Boshqacha so'rab ko'r."};
    }
  }catch(e){
    if(e.name !== "AbortError") failed = {status:"", msg:"Tarmoq xatosi. Internetni va key'ni tekshir."};
  }

  if(full.trim()){
    full = full.trim();
    c.msgs.push({role:"model", text:full}); save();
    body.innerHTML = md(full); addSrcs(bub, srcs); addActs(bub, full); markLast(); addTok(lastTok); autoTitle(c); summarize(c);
    if((cfg.auto || voiceMode) && !failed){
      spoke = true; feed(full, true);
      if(voiceMode){ vstate("Gapiryapman..."); sq.onEmpty = () => setTimeout(startListen, 300); sqNext(); }
    }
  } else {
    bub.remove(); c.msgs.pop(); save();
    if(failed){
      if(failed.status === 429) usage.exhausted = true;
      else { usage.count = Math.max(0, usage.count - 1); stamps.pop(); bump(-1); }
      LS.set("usage", usage);
      addErrRetry((failed.status ? `Xato ${failed.status}: ` : "") + failed.msg + (failed.status === 429 ? "\nLimit tugagan ko'rinadi. Tiklanish vaqti yuqorida." : ""));
    }
  }
  setBusy(false); renderQuota();
  if(voiceMode && !spoke) setTimeout(startListen, 800);
}

function feed(full, final){

}

function plain(t){
  return t.replace(/```[\s\S]*?(```|$)/g, " ").replace(/\[([^\]]+)\]\([^)]*\)/g, "$1").replace(/^\s*[-*•]\s+/gm, "").replace(/[|*#_>`]/g, "").replace(/\s+/g, " ").trim();
}
function inl(x){
  return esc(x).replace(/`([^`\n]+)`/g, "<code>$1</code>").replace(/\*\*([^*\n]+)\*\*/g, "<b>$1</b>")
    .replace(/(^|[^*])\*([^*\s][^*\n]*)\*/g, "$1<i>$2</i>")

}
function blocks(t){
  const L = t.split("\n"), out = [], UL = /^\s*[-*•]\s+/, OL = /^\s*\d+[.)]\s+/;
  let i = 0;
  while(i < L.length){
    const l = L[i];
    if(!l.trim()){ i++; continue; }
    let m;
    if((m = l.match(/^#{1,4}\s+(.*)/))){ out.push(`<h4>${inl(m[1])}</h4>`); i++; }
    else if(UL.test(l)){ const it = []; while(i < L.length && UL.test(L[i])) it.push(`<li>${inl(L[i++].replace(UL, ""))}</li>`); out.push(`<ul>${it.join("")}</ul>`); }
    else if(OL.test(l)){ const it = []; while(i < L.length && OL.test(L[i])) it.push(`<li>${inl(L[i++].replace(OL, ""))}</li>`); out.push(`<ol>${it.join("")}</ol>`); }
    else if(/^>/.test(l)){ const it = []; while(i < L.length && /^>/.test(L[i])) it.push(inl(L[i++].replace(/^>\s?/, ""))); out.push(`<blockquote>${it.join("<br>")}</blockquote>`); }
    else if(/^\|.*\|\s*$/.test(l) && i + 1 < L.length && /^\|?\s*:?-+:?\s*(\|\s*:?-+:?\s*)*\|?\s*$/.test(L[i+1])){
      const rows = []; while(i < L.length && /^\|.*\|\s*$/.test(L[i])) rows.push(L[i++]);
      const cells = r => r.trim().replace(/^\||\|$/g, "").split("|").map(c => inl(c.trim()));
      out.push(`<div class="tw"><table><thead><tr>${cells(rows[0]).map(c => `<th>${c}</th>`).join("")}</tr></thead><tbody>${rows.slice(2).map(r => `<tr>${cells(r).map(c => `<td>${c}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`);
    }
    else {
      const p = [inl(L[i++])];
      while(i < L.length && L[i].trim() && !/^(#{1,4}\s|>|\|)/.test(L[i]) && !UL.test(L[i]) && !OL.test(L[i])) p.push(inl(L[i++]));
      out.push(`<p>${p.join("<br>")}</p>`);
    }
  }
  return out.join("");
}

async function transcribe(blob){
  usage.count++; LS.set("usage", usage); bump(1); renderQuota();
  try{
    const data = await new Promise((ok, no) => { const r = new FileReader(); r.onload = () => ok(r.result.split(",")[1]); r.onerror = no; r.readAsDataURL(blob); });
    const lang = {"uz-UZ":"o'zbekcha", "ru-RU":"ruscha", "en-US":"inglizcha"}[roleLang() || cfg.lang] || "o'zbekcha";
    const r = await fetch(`${apiBase()}/v1beta/models/${encodeURIComponent(cfg.model)}:generateContent`, {method:"POST", headers:apiHeaders(),
      body:JSON.stringify({contents:[{parts:[{text:`Quyidagi audioni so'zma-so'z matnga aylantir (til: ${lang}). Faqat gapirilgan matnni yoz, boshqa hech narsa qo'shma.`}, {inlineData:{mimeType:"audio/wav", data}}]}]})});
    const d = await r.json();
    if(!r.ok) throw new Error((d.error && d.error.message) || r.status);
    return d.candidates[0].content.parts.map(p => p.text || "").join("").trim();
  }catch(e){ addMsg("err", "Ovozni matnga aylantirib bo'lmadi: " + e.message); return ""; }
}
async function geminiListen(){
  listening = true; vstate("Tinglayapman...");
  let st, ac, pr, parts = [], heard = false, quiet = 0, ok = true;
  const t0 = Date.now();
  try{
    st = await navigator.mediaDevices.getUserMedia({audio:true});
    ac = new (window.AudioContext || window.webkitAudioContext)();
    const src = ac.createMediaStreamSource(st);
    pr = ac.createScriptProcessor(4096, 1, 1);
    await new Promise(res => {
      pr.onaudioprocess = e => {
        const d = e.inputBuffer.getChannelData(0);
        let m = 0; for(let i = 0; i < d.length; i++) m = Math.max(m, Math.abs(d[i]));
        parts.push(new Float32Array(d));
        if(m > 0.06){ heard = true; quiet = 0; } else if(heard) quiet += d.length / ac.sampleRate;
        if(!voiceMode || (heard && quiet > 1.2) || (!heard && Date.now() - t0 > 8000) || Date.now() - t0 > 30000) res();
      };
      src.connect(pr); pr.connect(ac.destination);
    });
  }catch(e){ ok = false; addMsg("err", "Mikrofonni ishga tushirib bo'lmadi."); stopVoice(); }
  const sr = ac ? ac.sampleRate : 44100;
  try{ pr.disconnect(); st.getTracks().forEach(t => t.stop()); ac.close(); }catch(e){}
  listening = false;
  if(!ok || !voiceMode) return;
  if(!heard){ setTimeout(startListen, 300); return; }
  vstate("O'ylayapman...");
  const text = await transcribe(wav(parts, sr));
  if(!voiceMode) return;
  if(text){ $("inp").value = text; $("form").requestSubmit(); } else stopVoice();
}
async function summarize(c){
  if(c.msgs.length < 20 || c.msgs.length - (c.sumAt || 0) < 10) return;
  const old = c.msgs.slice(0, -10).map(m => (m.role === "user" ? "Foydalanuvchi: " : "AI: ") + m.text.slice(0, 500)).join("\n");
  c.sumAt = c.msgs.length;
  usage.count++; LS.set("usage", usage); bump(1); renderQuota();
  try{
    const r = await fetch(`${apiBase()}/v1beta/models/${encodeURIComponent(cfg.model)}:generateContent`, {method:"POST", headers:apiHeaders(),
      body:JSON.stringify({contents:[{role:"user", parts:[{text:"Quyidagi suhbatning muhim qismini 6-8 gapda o'zbekcha xulosa qil: nimalar haqida gaplashildi, foydalanuvchi qanday ma'lumot aytdi, nimalar kelishildi.\n\n" + (c.summary ? "Oldingi xulosa: " + c.summary + "\n\n" : "") + old}]}]})});
    const d = await r.json();
    const t = d.candidates[0].content.parts.map(p => p.text || "").join("").trim();
    if(t){ c.summary = t; save(); }
  }catch(e){ c.sumAt = 0; }
}
